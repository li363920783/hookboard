<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070a0f">
<title>Hookboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070a0f;
    --bg-2: #0a0f16;
    --panel: #0c121a;
    --card: #0f1722;
    --card-2: #131d2b;
    --line: #1a2533;
    --line-2: #253647;
    --text: #e9f1f8;
    --muted: #9db0c3;
    --dim: #7b8fa3;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --pending: #94a3b8;
    --running: #38bdf8;
    --waiting: #fbbf24;
    --done: #34d399;
    --failed: #fb7185;
    --radius: 13px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body.modal { overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  [hidden] { display: none !important; }
  a { color: #7dd3fc; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Static backdrop. Painted once: a fixed layer that never animates, so
     scrolling and polling cost nothing. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image:
      linear-gradient(rgba(56, 189, 248, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, .045) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 95% 62% at 50% -6%, #000 12%, transparent 72%);
    mask-image: radial-gradient(ellipse 95% 62% at 50% -6%, #000 12%, transparent 72%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(920px 430px at 12% -10%, rgba(56, 189, 248, .13), transparent 62%),
      radial-gradient(780px 380px at 88% -14%, rgba(129, 140, 248, .10), transparent 60%);
  }

  ::selection { background: rgba(56, 189, 248, .28); }
  * { scrollbar-width: thin; scrollbar-color: #22354a transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: #1f3042; border-radius: 8px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #2b4459; background-clip: padding-box; }

  /* ------------------------------------------------------------- top bar */
  header.topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 18px;
    padding: 11px 22px;
    background: #080d13;
    border-bottom: 1px solid var(--line);
  }
  header.topbar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56, 189, 248, .5),
                rgba(129, 140, 248, .38), transparent);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    display: grid; place-items: center;
    width: 24px; height: 24px; border-radius: 7px;
    font-size: 11px; color: #7dd3fc;
    background: linear-gradient(160deg, rgba(56, 189, 248, .22), rgba(129, 140, 248, .14));
    border: 1px solid rgba(56, 189, 248, .32);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10);
  }
  .brand h1 {
    margin: 0; font-size: 14px; font-weight: 700;
    letter-spacing: .17em; text-transform: uppercase;
    background: linear-gradient(92deg, #eaf6ff, #7dd3fc 58%, #818cf8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); transition: background .2s, box-shadow .2s;
  }
  .dot.on { background: var(--done); box-shadow: 0 0 0 3px rgba(52, 211, 153, .12), 0 0 12px rgba(52, 211, 153, .55); }
  .dot.off { background: var(--failed); box-shadow: 0 0 0 3px rgba(251, 113, 133, .12), 0 0 12px rgba(251, 113, 133, .5); }

  #counts { display: flex; gap: 7px; flex-wrap: wrap; margin-left: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px;
    background: rgba(13, 20, 29, .75);
  }
  .chip b {
    font-variant-numeric: tabular-nums; font-family: var(--mono);
    font-size: 12.5px; color: var(--text); font-weight: 600;
    transition: color .2s ease;
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
  .chip-pending i { color: var(--pending); } .chip-pending b { color: var(--pending); }
  .chip-running i { color: var(--running); } .chip-running b { color: var(--running); }
  .chip-waiting i { color: var(--waiting); } .chip-waiting b { color: var(--waiting); }
  .chip-done i { color: var(--done); } .chip-done b { color: var(--done); }
  .chip-failed i { color: var(--failed); } .chip-failed b { color: var(--failed); }
  .chip.bump b { animation: bump .34s cubic-bezier(.2, .8, .3, 1); }
  @keyframes bump { 40% { transform: scale(1.22); } }

  .bar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  /* 来源筛选：选项由看板数据里的 task.source 自动生成，新渠道（如 wechat）出现即自动可选 */
  #source-filter {
    font: inherit; font-size: 12.5px; color: var(--text);
    background: #131d29; border: 1px solid var(--line-2);
    border-radius: 9px; padding: 6px 9px; cursor: pointer;
  }
  #source-filter.active { border-color: rgba(56, 189, 248, .55); color: #7dd3fc; }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    color: var(--text); background: #131d29; border: 1px solid var(--line-2);
    border-radius: 9px; padding: 7px 13px;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .06s;
  }
  button:hover { background: #192534; border-color: #34506a; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid rgba(56, 189, 248, .7); outline-offset: 2px; }
  button.primary {
    background: linear-gradient(180deg, #2563eb, #1d4ed8);
    border-color: #3b76f6;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .10) inset, 0 6px 18px rgba(0, 0, 0, .38);
  }
  button.primary:hover { background: linear-gradient(180deg, #2f6ff0, #2358e0); }
  button.ghost { background: transparent; }
  button.danger { color: #fda4af; border-color: #4a2229; background: #1c1013; }
  button.danger:hover { background: #261318; border-color: #6a2c36; }
  button.small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  button:disabled { opacity: .55; cursor: progress; }

  /* ---------------------------------------------------------------- board */
  main.board {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px; padding: 18px 22px 20px; align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  /* Wide screens: the page itself never scrolls. Every status column is its
     own scroll container, so the top bar and the column heads stay put while
     you scroll one lane. Narrow screens keep plain page scrolling. */
  @media (min-width: 681px) {
    body { display: flex; flex-direction: column; }
    main.board { flex: 1 1 auto; min-height: 0; overflow: hidden; align-items: stretch; }
    .col { min-height: 0; }
    .cards {
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto; overscroll-behavior: contain;
      padding-right: 2px;
    }
    .col > header { position: static; }
  }
  .col > header {
    position: sticky; top: 57px; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 4px 8px;
    background: linear-gradient(var(--bg) 72%, rgba(7, 10, 15, 0));
  }
  .col > header::after {
    content: ""; position: absolute; left: 4px; right: 4px; bottom: 0; height: 1px;
    background: linear-gradient(90deg, var(--line-2), transparent 85%);
  }
  .col h2 {
    margin: 0; font-size: 12px; font-weight: 650;
    letter-spacing: .12em; color: var(--muted); text-transform: uppercase;
  }
  .col .n {
    margin-left: auto; font-size: 11.5px; color: var(--dim);
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
    background: rgba(13, 20, 29, .6);
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .col-pending .pulse { background: var(--pending); }
  .col-running .pulse { background: var(--running); box-shadow: 0 0 10px rgba(56, 189, 248, .8); animation: pulse 1.7s ease-in-out infinite; }
  .col-waiting .pulse { background: var(--waiting); box-shadow: 0 0 10px rgba(251, 191, 36, .6); animation: pulse 2.4s ease-in-out infinite; }
  .col-done .pulse { background: var(--done); }
  .col-failed .pulse { background: var(--failed); }
  @keyframes pulse { 50% { opacity: .32; transform: scale(.82); } }

  .cards { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .cards:empty::after {
    content: "暂无任务";
    display: block; padding: 18px 12px; text-align: center;
    color: var(--dim); font-size: 12px; letter-spacing: .06em;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 13px 12px 15px;
    cursor: pointer;
    overflow-wrap: anywhere;
    contain: layout paint;
    transition: border-color .16s, box-shadow .16s, transform .16s;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--dim); opacity: .45;
    transition: opacity .2s, background .2s;
  }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .07) 40%, transparent);
  }
  .card:hover {
    border-color: #2f4a60; transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .45), 0 0 0 1px rgba(56, 189, 248, .10);
  }
  .card:hover::before { opacity: 1; }
  .card:focus-visible { outline: 2px solid rgba(56, 189, 248, .8); outline-offset: 2px; }
  .st-running, .st-waiting { border-color: #244055; }
  .st-running::before { background: var(--running); opacity: 1; box-shadow: 0 0 10px rgba(56, 189, 248, .85); animation: barPulse 1.9s ease-in-out infinite; }
  .st-waiting::before { background: var(--waiting); opacity: 1; box-shadow: 0 0 10px rgba(251, 191, 36, .7); }
  .st-done::before { background: var(--done); }
  .st-failed::before, .st-cancelled::before { background: var(--failed); }
  .col-done .card { opacity: .76; }
  .col-done .card:hover { opacity: 1; }
  @keyframes barPulse { 50% { opacity: .3; } }
  /* Only cards that are actually new animate in; reused nodes never replay. */
  .card.in { animation: cardIn .24s cubic-bezier(.2, .8, .3, 1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px) scale(.995); } }

  .card .top { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  .src {
    color: #8fd3ff; background: rgba(18, 60, 86, .5);
    border: 1px solid rgba(56, 130, 178, .32);
    border-radius: 6px; padding: 1px 7px; letter-spacing: .04em;
    text-transform: uppercase; font-size: 11.5px;
  }
  .ext {
    color: var(--dim); margin-left: auto; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 58%;
    font-family: var(--mono); font-size: 11px;
  }
  .card h3 { margin: 8px 0 8px; font-size: 15px; font-weight: 600; line-height: 1.45; }
  .meta { display: flex; gap: 7px; align-items: center; font-size: 12px; color: var(--dim); }
  .meta .rel { font-variant-numeric: tabular-nums; }
  .stage {
    color: var(--muted); font-family: var(--mono); font-size: 11px;
    letter-spacing: .04em; text-transform: uppercase;
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line);
    border-radius: 5px; padding: 0 6px;
  }
  .badge-live {
    margin-left: auto; font-size: 11px; color: var(--running);
    border: 1px solid rgba(56, 189, 248, .35); border-radius: 999px; padding: 0 7px;
    background: rgba(56, 189, 248, .06);
  }
  .card .note {
    margin: 8px 0 0; font-size: 12.5px; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .approval { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); cursor: default; }
  .approval .q { margin: 0 0 8px; font-size: 12.5px; color: #fcd34d; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .approval textarea {
    width: 100%; margin-top: 8px; padding: 7px 9px; resize: vertical;
    font: inherit; font-size: 12.5px; color: var(--text);
    background: #090f16; border: 1px solid var(--line-2); border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus, input:focus, select:focus {
    outline: none; border-color: rgba(56, 189, 248, .55);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, .10);
  }
  button.send { width: 100%; margin-top: 6px; }
  .approval .q.done { color: var(--dim); }

  /* --------------------------------------------------------------- drawer */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4, 6, 9, .62); }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(620px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -24px 0 60px rgba(0, 0, 0, .55);
    display: flex; flex-direction: column;
    /* The panel is its own scroll context; without this its content grows past
       the fixed box and the wheel scrolls the page behind it. */
    overflow: hidden;
    animation: slide .2s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes slide { from { transform: translateX(26px); opacity: .5; } }
  .drawer header {
    flex: none;
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px 18px 13px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(56, 189, 248, .04), transparent);
  }
  .drawer header > div { flex: 1 1 auto; min-width: 0; }
  .drawer header h2 { margin: 7px 0 0; font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
  .drawer header .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .drawer .close { margin-left: auto; flex: none; }
  /* flex + min-height:0 is what makes this a scroll container instead of a box
     that pushes its overflow onto the document scroller. */
  .drawer .body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 18px 28px;
  }
  .drawer .foot {
    flex: none;
    padding: 12px 18px; border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end; background: var(--bg-2);
  }
  .tag {
    font-size: 11.5px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line-2);
    color: var(--muted); background: rgba(255, 255, 255, .02); letter-spacing: .03em;
  }
  .tag.waiting { color: var(--waiting); border-color: rgba(251, 191, 36, .4); }
  .tag.running { color: var(--running); border-color: rgba(56, 189, 248, .4); }
  .tag.done { color: var(--done); border-color: rgba(52, 211, 153, .35); }
  .tag.failed, .tag.cancelled { color: var(--failed); border-color: rgba(251, 113, 133, .35); }

  .section { margin-top: 20px; }
  .section > h3 {
    margin: 0 0 9px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); font-weight: 650;
  }
  .doc {
    white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 13px; line-height: 1.72; color: #cddbea;
    background: rgba(255, 255, 255, .02); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; max-height: 30vh; overflow: auto;
  }
  .doc strong { color: var(--text); font-weight: 650; }
  .facts { display: grid; grid-template-columns: 96px 1fr; gap: 5px 12px; font-size: 12.5px; }
  .facts dt { color: var(--dim); }
  .facts dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .timeline li {
    display: grid; grid-template-columns: 62px 128px 1fr; gap: 10px;
    padding: 5px 0; border-bottom: 1px solid rgba(26, 37, 51, .7);
    font-size: 12px; color: var(--muted);
  }
  .timeline time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11.5px; font-family: var(--mono); }
  .timeline .kind { font-family: var(--mono); font-size: 11.5px; color: #9fd4ff; }
  .timeline .kind.err { color: var(--failed); }
  .timeline .kind.ok { color: var(--done); }

  .run {
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px;
    background: rgba(255, 255, 255, .015); font-size: 12.5px;
  }
  .run .head { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .run .head .ok { color: var(--done); } .run .head .bad { color: var(--failed); }
  pre {
    white-space: pre-wrap; word-break: break-all;
    font: 12px/1.6 var(--mono);
    background: #080d13; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; max-height: 46vh; overflow: auto; margin: 8px 0 0;
  }
  details summary { cursor: pointer; color: #7dd3fc; font-size: 12px; }
  details[open] summary { margin-bottom: 6px; }

  .composer textarea, .drawer textarea {
    width: 100%; padding: 9px 10px; resize: vertical;
    font: inherit; font-size: 13px; color: var(--text);
    background: #090f16; border: 1px solid var(--line-2); border-radius: 10px;
  }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }

  /* -------------------------------------------------------------- dialogs */
  dialog {
    border: 1px solid var(--line-2); border-radius: 16px; padding: 0;
    background: var(--panel); color: var(--text); width: min(520px, calc(100vw - 32px));
    box-shadow: 0 30px 80px rgba(0, 0, 0, .65), 0 0 0 1px rgba(56, 189, 248, .08);
  }
  dialog::backdrop { background: rgba(4, 6, 9, .66); }
  dialog form { padding: 18px; }
  dialog h2 { margin: 0 0 10px; font-size: 16px; letter-spacing: .02em; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  dialog input[type="password"], dialog select {
    width: 100%; padding: 8px 10px; border-radius: 9px; font: inherit; font-size: 13px;
    background: #090f16; color: var(--text); border: 1px solid var(--line-2);
  }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* ---------------------------------------------------------------- toast */
  #toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 80;
    transform: translate(-50%, 8px);
    background: #101a24; color: var(--text); border: 1px solid var(--line-2);
    border-radius: 11px; padding: 9px 16px; font-size: 13px; max-width: 90vw;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .55), 0 0 0 1px rgba(56, 189, 248, .06);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { border-color: #7f1d1d; background: #2a1114; color: #fecaca; }

  /* ------------------------------------------------------------ progress */
  #progress {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60;
    opacity: 0; transition: opacity .2s ease; pointer-events: none; overflow: hidden;
  }
  #progress.show { opacity: 1; }
  #progress::after {
    content: ""; display: block; height: 100%; width: 38%;
    background: linear-gradient(90deg, transparent, var(--accent), #a5b4fc, transparent);
    box-shadow: 0 0 12px rgba(56, 189, 248, .8);
    animation: sweep 1.1s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(320%); } }

  /* Skeletons: first paint is never an empty board. Static gradient, no
     background-position animation (that repaints at 60fps). */
  .skel {
    height: 92px; border-radius: var(--radius); border: 1px solid var(--line);
    background: linear-gradient(100deg, #0c131b 20%, #121d29 50%, #0c131b 80%);
    animation: skelFade 1.4s ease-in-out infinite;
  }
  .skel:nth-child(2) { height: 76px; }
  @keyframes skelFade { 50% { opacity: .55; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 980px) {
    main.board { grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; }
  }
  @media (max-width: 680px) {
    main.board { grid-template-columns: 1fr; gap: 18px; }
    /* Two stacked rows would overlap a sticky header pinned at a fixed top. */
    header.topbar { position: static; padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
    #counts { order: 3; width: 100%; margin-left: 0; }
    .col > header { position: static; padding-top: 4px; }
    .timeline li { grid-template-columns: 52px 1fr; }
    .timeline .detail { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="topbar">
  <div class="brand">
    <span class="mark">◆</span>
    <h1>Hookboard</h1>
    <span id="live" class="dot" title="轮询 /api/board"></span>
  </div>
  <nav id="counts"></nav>
  <div class="bar-actions">
    <select id="source-filter" title="按来源筛选" aria-label="按来源筛选"></select>
    <button id="new-task" class="primary">＋ 新任务</button>
    <button id="settings" class="ghost" title="API Token 设置">⚙</button>
  </div>
</header>

<main class="board" id="board"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="任务详情"></aside>

<dialog id="composer">
  <form method="dialog" id="composer-form">
    <h2>下发任务指令</h2>
    <label for="composer-text">指令 / 标题</label>
    <textarea id="composer-text" rows="5" placeholder="要做什么、验收标准是什么。会按任务流水线走审批再派单。"></textarea>
    <label for="composer-project">项目</label>
    <select id="composer-project"><option value="">默认（不指定）</option></select>
    <p class="hint">写操作需要 API Token（右上角 ⚙ 设置一次，保存在本机浏览器）。</p>
    <div class="dialog-actions">
      <button type="button" id="composer-cancel" class="ghost">取消</button>
      <button type="submit" id="composer-submit" class="primary">创建任务</button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog">
  <form method="dialog" id="settings-form">
    <h2>API Token</h2>
    <p class="hint">新建任务、发指令、唤醒/取消任务需要它；只存在这台浏览器里。</p>
    <label for="token-input">X-Hub-Token</label>
    <input id="token-input" type="password" autocomplete="off" placeholder="服务端 config 里的 server.api_token">
    <div class="dialog-actions">
      <button type="button" id="settings-clear" class="ghost">清除</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var COLUMNS = [
    ["pending", "待处理"],
    ["running", "进行中"],
    ["waiting", "等你审批"],
    ["done", "已完成"],
    ["failed", "失败"]
  ];
  var board = document.getElementById("board");
  var counts = document.getElementById("counts");
  var liveDot = document.getElementById("live");
  var toastEl = document.getElementById("toast");
  var drawer = document.getElementById("drawer");
  var scrim = document.getElementById("scrim");
  var composer = document.getElementById("composer");
  var settingsDialog = document.getElementById("settings-dialog");

  var lastJson = "";
  var toastTimer = null;
  var openTaskId = null;
  var detailHtml = "";
  var projects = [];
  var lastData = null;
  // 来源筛选：'' = 全部；选项从看板数据里的 task.source 自动生成，
  // 所以今天有 feishu/tapd，将来出现 wechat 也无需改代码。
  var sourceFilter = localStorage.getItem("hookboard_source") || "";

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function num(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }
  function elapsed(ts) {
    var n = Number(ts);
    if (!Number.isFinite(n) || !n) return "—";
    var s = Math.max(0, Math.floor(Date.now() / 1000 - n));
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    return Math.floor(s / 86400) + "d";
  }
  function clock(ts) {
    var n = Number(ts);
    if (!Number.isFinite(n) || !n) return "—";
    var d = new Date(n * 1000);
    return d.toLocaleString("zh-CN", { hour12: false });
  }
  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 4200);
  }

  /* ------------------------------------------------------------ API */
  function token() { return localStorage.getItem("hookboard_token") || ""; }

  async function writeJSON(url, payload) {
    if (!token()) { openSettings(); throw new Error("先设置 API Token"); }
    var response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Hub-Token": token() },
      body: JSON.stringify(payload)
    });
    if (response.status === 401) { openSettings(); throw new Error("API Token 无效"); }
    var data = await response.json().catch(function () { return {}; });
    if (!response.ok || data.ok === false) {
      throw new Error(data.error || data.detail || ("HTTP " + response.status));
    }
    return data;
  }

  function openSettings() {
    document.getElementById("token-input").value = token();
    if (!settingsDialog.open) settingsDialog.showModal();
  }
  document.getElementById("settings").addEventListener("click", openSettings);
  document.getElementById("settings-form").addEventListener("submit", function (event) {
    event.preventDefault();
    localStorage.setItem("hookboard_token", document.getElementById("token-input").value.trim());
    settingsDialog.close();
    toast("Token 已保存");
  });
  document.getElementById("settings-clear").addEventListener("click", function () {
    localStorage.removeItem("hookboard_token");
    settingsDialog.close();
    toast("Token 已清除");
  });

  /* ---------------------------------------------------- board rendering */
  function approvalHtml(task) {
    var ap = task.approval;
    if (!ap) return "";
    var tokenValue = esc(ap.token);
    var options = Array.isArray(ap.options) ? ap.options : [];
    var recommend = num(ap.recommend);
    var buttons = options.map(function (label, index) {
      return '<button class="small' + (index === recommend ? " primary" : "") +
        '" data-decide="' + index + '" data-token="' + tokenValue + '">' + esc(label) + "</button>";
    }).join("");
    return '<div class="approval">' +
      '<p class="q">' + esc(ap.question) + "</p>" +
      '<div class="opts">' + buttons + "</div>" +
      '<textarea rows="2" placeholder="补充意见（提交视为通过）"></textarea>' +
      '<button class="send" data-send="1" data-token="' + tokenValue + '">提交</button>' +
      "</div>";
  }

  // `elapsed` is deliberately NOT in this markup: it changes every second on
  // a fresh task, which used to force a full column re-render each poll.
  // It lives in <time data-ts> and is patched as text in tickTimes().
  function cardHtml(task) {
    var note = task.note ? '<p class="note">' + esc(task.note) + "</p>" : "";
    var live = task.session ? '<span class="badge-live" title="' + esc(task.session) + '">已派单</span>' : "";
    return '<article class="card st-' + esc(task.status) + '" data-id="' + esc(task.id) + '" tabindex="0">' +
      '<div class="top"><span class="src">' + esc(task.source) + "</span>" +
      '<span class="ext" title="' + esc(task.external_id) + '">' + esc(task.external_id) + "</span></div>" +
      "<h3>" + esc(task.title) + "</h3>" +
      '<div class="meta"><span class="stage">' + esc(task.stage) + "</span><span>·</span>" +
      '<time class="rel" data-ts="' + num(task.created_at) + '">' + elapsed(task.created_at) + "</time>" +
      live + "</div>" +
      note +
      approvalHtml(task) +
      "</article>";
  }

  var colNodes = {};      // key -> <section>
  var cardNodes = {};     // taskId -> {el, html}
  var chipNums = {};      // key -> <b>
  var lastTotals = {};
  var columnsReady = false;

  function ensureColumns() {
    if (columnsReady) return;
    board.innerHTML = COLUMNS.map(function (pair) {
      return '<section class="col col-' + pair[0] + '">' +
        '<header><span class="pulse"></span><h2>' + pair[1] + "</h2>" +
        '<span class="n">0</span></header><div class="cards"></div></section>';
    }).join("");
    counts.innerHTML = COLUMNS.map(function (pair) {
      return '<span class="chip chip-' + pair[0] + '"><i></i><b>0</b>' + pair[1] + "</span>";
    }).join("");
    COLUMNS.forEach(function (pair) {
      colNodes[pair[0]] = board.querySelector(".col-" + pair[0]);
      chipNums[pair[0]] = counts.querySelector(".chip-" + pair[0] + " b");
    });
    columnsReady = true;
  }

  function skeleton() {
    board.innerHTML = COLUMNS.map(function (pair) {
      return '<section class="col col-' + pair[0] + '">' +
        '<header><span class="pulse"></span><h2>' + pair[1] + '</h2><span class="n">·</span></header>' +
        '<div class="cards"><div class="skel"></div><div class="skel"></div></div></section>';
    }).join("");
  }

  function tickTimes(root) {
    var nodes = (root || board).querySelectorAll("time.rel");
    for (var i = 0; i < nodes.length; i += 1) {
      var next = elapsed(nodes[i].dataset.ts);
      if (nodes[i].textContent !== next) nodes[i].textContent = next;
    }
  }

  function renderColumn(key, tasks) {
    var col = colNodes[key];
    col.querySelector(".n").textContent = String(tasks.length);
    var holder = col.querySelector(".cards");
    var desired = [];
    var seen = {};

    tasks.forEach(function (task) {
      var id = String(task.id);
      if (seen[id]) return;
      seen[id] = 1;
      var html = cardHtml(task);
      var entry = cardNodes[id];
      if (!entry || entry.html !== html) {
        var wrap = document.createElement("div");
        wrap.innerHTML = html;
        var el = wrap.firstElementChild;
        el.classList.add("in");
        el.addEventListener("animationend", function () { el.classList.remove("in"); }, { once: true });
        if (entry && entry.el && entry.el.parentNode) entry.el.replaceWith(el);
        entry = { el: el, html: html };
        cardNodes[id] = entry;
      }
      desired.push(entry.el);
    });

    // Drop cards that left this column (moved elsewhere or gone).
    var keep = new Set(desired);
    Array.prototype.slice.call(holder.children).forEach(function (node) {
      if (!keep.has(node)) node.remove();
    });
    // Reorder only where needed; untouched cards keep their DOM and state.
    var cursor = holder.firstElementChild;
    for (var i = 0; i < desired.length; i += 1) {
      var el = desired[i];
      if (el === cursor) { cursor = cursor.nextElementSibling; }
      else { holder.insertBefore(el, cursor); }
    }
  }

  var sourceFilterEl = document.getElementById("source-filter");
  function filteredTasks(column) {
    var tasks = (column || {}).tasks || [];
    if (!sourceFilter) return tasks;
    return tasks.filter(function (task) { return String(task.source) === sourceFilter; });
  }

  function syncSourceOptions(data) {
    var seen = {};
    (data.columns || []).forEach(function (column) {
      (column.tasks || []).forEach(function (task) {
        if (task.source) seen[String(task.source)] = 1;
      });
    });
    if (sourceFilter) seen[sourceFilter] = 1;   // 选中的来源即使当前无任务也留在选项里
    var names = Object.keys(seen).sort();
    var html = '<option value="">全部来源</option>' + names.map(function (name) {
      return '<option value="' + esc(name) + '">' + esc(name) + "</option>";
    }).join("");
    if (sourceFilterEl.dataset.html !== html) {
      sourceFilterEl.innerHTML = html;
      sourceFilterEl.dataset.html = html;
    }
    sourceFilterEl.value = sourceFilter;
    sourceFilterEl.classList.toggle("active", !!sourceFilter);
  }

  sourceFilterEl.addEventListener("change", function () {
    sourceFilter = sourceFilterEl.value;
    localStorage.setItem("hookboard_source", sourceFilter);
    sourceFilterEl.classList.toggle("active", !!sourceFilter);
    lastTotals = {};   // 换筛选口径后不拿旧数字做 bump 比较
    if (lastData) { render(lastData); lastJson = ""; }
  });

  function render(data) {
    var byKey = {};
    (data.columns || []).forEach(function (column) { byKey[column.key] = column; });
    ensureColumns();
    COLUMNS.forEach(function (pair) {
      renderColumn(pair[0], filteredTasks(byKey[pair[0]]));
    });

    // 角标一律按实际渲染的卡片数算（含筛选），保证角标与列内卡片永不分叉
    COLUMNS.forEach(function (pair) {
      var value = filteredTasks(byKey[pair[0]]).length;
      var el = chipNums[pair[0]];
      if (el && el.textContent !== String(value)) {
        el.textContent = String(value);
        if (lastTotals[pair[0]] !== undefined && lastTotals[pair[0]] !== value) {
          var chip = el.parentNode;
          chip.classList.add("bump");
          setTimeout(function () { chip.classList.remove("bump"); }, 420);
        }
      }
      lastTotals[pair[0]] = value;
    });

    if (Array.isArray(data.projects) && data.projects.join() !== projects.join()) {
      projects = data.projects;
      var select = document.getElementById("composer-project");
      select.innerHTML = '<option value="">默认（不指定）</option>' + projects.map(function (name) {
        return '<option value="' + esc(name) + '">' + esc(name) + "</option>";
      }).join("");
    }
  }

  function isTyping() {
    var active = document.activeElement;
    if (!active) return false;
    if (!board.contains(active) && !drawer.contains(active)) return false;
    return active.tagName === "TEXTAREA" || active.tagName === "INPUT";
  }

  var progressEl = document.getElementById("progress");
  var progressTimer = null;
  // A thin bar only appears when the request is slow enough to notice.
  function busy(on) {
    clearTimeout(progressTimer);
    if (on) {
      progressTimer = setTimeout(function () { progressEl.classList.add("show"); }, 180);
    } else {
      progressEl.classList.remove("show");
    }
  }

  async function refresh() {
    if (document.hidden || isTyping()) return;
    busy(true);
    try {
      var response = await fetch("/api/board", { cache: "no-store" });
      var data = await response.json();
      lastData = data;
      syncSourceOptions(data);
      // `generated_at` changes on every request; comparing it meant a full
      // render every 3s no matter what. Only the board payload matters.
      var encoded = JSON.stringify([data.columns, data.counts, data.projects, sourceFilter]);
      if (encoded !== lastJson) { render(data); lastJson = encoded; }
      tickTimes(board);
      liveDot.className = "dot on";
      if (openTaskId && drawer.hidden === false) refreshDetail(openTaskId);
    } catch (err) {
      liveDot.className = "dot off";
    } finally {
      busy(false);
    }
  }

  /* --------------------------------------------------------- detail view */
  function factsHtml(task) {
    var rows = [
      ["状态", task.status + " / " + task.stage],
      ["项目", task.project || "—"],
      ["派单目标", task.workspace ? task.workspace + (task.branch ? " @ " + task.branch : "") : "—"],
      ["会话", task.session || "—"],
      ["来源 / 类型", task.source + " · " + task.kind],
      ["条目", task.external_id],
      ["创建", clock(task.created_at) + "（" + elapsed(task.created_at) + "）"],
      ["更新", clock(task.updated_at)],
      ["尝试", String(num(task.attempts))]
    ];
    return '<dl class="facts">' + rows.map(function (row) {
      return "<dt>" + esc(row[0]) + "</dt><dd" +
        (row[0] === "会话" || row[0] === "派单目标" || row[0] === "条目" ? ' class="mono"' : "") +
        ">" + esc(row[1]) + "</dd>";
    }).join("") + "</dl>";
  }

  var KIND_LABEL = {
    created: "创建", approval_open: "发起审批", approved: "审批通过",
    rejected: "审批打回", done: "任务完成", failed: "失败",
    merged: "并入原任务", message: "发送指令", message_error: "指令发送失败",
    requeue: "重新入队", retry: "重试", cancelled: "取消",
    notify_error: "通知失败", session_step: "继续会话"
  };

  // Ticket bodies and agent reports are light markdown; render bold only.
  function mdInline(text) {
    return esc(text).replace(/\*\*([^*\n]{1,80})\*\*/g, "<strong>$1</strong>");
  }

  // What the agent actually delivered: the last successful work/release run
  // that reads like a report. Async adapters also log their own JSON
  // {"threadId":...} as a work run; that is metadata, not a delivery.
  function deliveryRun(runs) {
    var best = null;
    var bestLen = 0;
    (runs || []).forEach(function (run) {
      var out = String(run.output || "");
      if (!run.ok || out.trim().length < 40) return;
      if (/^\s*\{/.test(out)) return;
      if (["work", "release", "finish"].indexOf(run.stage) < 0) return;
      // Longest report wins: `finish` is the ticket callback ("-> resolved;
      // comment posted"), the work run is what the agent actually did.
      if (out.length >= bestLen) { best = run; bestLen = out.length; }
    });
    return best;
  }

  function contextHtml(task) {
    var text = String(task.context || "").trim();
    if (!text) return "";
    return '<div class="section"><h3>需求详情</h3><div class="doc">' + mdInline(text) + "</div></div>";
  }

  function deliveryHtml(detail) {
    var run = deliveryRun(detail.runs);
    if (!run) return "";
    var seconds = Math.max(0, Math.round((run.finished_at || 0) - (run.started_at || 0)));
    return '<div class="section"><h3>交付结果 · ' + esc(run.stage) +
      (seconds ? " · " + seconds + "s" : "") + '</h3><div class="doc">' +
      mdInline(String(run.output || "")) + "</div></div>";
  }

  function approvalsHtml(detail) {
    var list = detail.approvals || [];
    if (!list.length) return "";
    var rows = list.map(function (ap) {
      var state = ap.status === "open" ? "待处理"
        : (ap.status === "superseded" ? "已作废"
        : (Number(ap.answer_index) === 1 ? "打回" : "通过"));
      var answer = String(ap.answer_text || "").trim();
      if (answer === "通过" || answer === "打回") answer = "";
      var who = String(ap.by || "");
      if (who.indexOf("feishu:") === 0) who = "飞书 …" + who.slice(-6);
      return "<li><time>" + esc(clock(ap.decided_at || ap.created_at).replace(/^.*?\s/, "")) + "</time>" +
        '<span class="kind">' + esc(ap.stage) + "</span>" +
        '<span class="detail">' + esc(state) +
        (answer ? " · " + esc(answer) : "") +
        (who && ap.status !== "open" ? " · " + esc(who) : "") + "</span></li>";
    }).join("");
    return '<div class="section"><h3>审批记录</h3><ul class="timeline">' + rows + "</ul></div>";
  }

  // Stage ticks are pipeline plumbing, not history: the engine used to log one
  // per poll (a task could carry 100+ identical rows). Runs already show the
  // stage, so the process list keeps only things that happened to the task.
  function processHtml(events) {
    var rows = (events || []).filter(function (event) { return event.kind !== "stage"; });
    if (!rows.length) return "";
    return '<div class="section"><h3>过程</h3><ul class="timeline">' +
      rows.slice().reverse().map(function (event) {
        var kind = String(event.kind || "");
        var cls = /error|fail/.test(kind) ? " err" : (/done|approved/.test(kind) ? " ok" : "");
        return "<li><time>" + esc(clock(event.ts).replace(/^.*?\s/, "")) + "</time>" +
          '<span class="kind' + cls + '">' + esc(KIND_LABEL[kind] || kind) + "</span>" +
          '<span class="detail">' + esc(event.detail || "") + "</span></li>";
      }).join("") + "</ul></div>";
  }

  function rawHtml(task, events) {
    var lines = (events || []).slice(-300).map(function (event) {
      return clock(event.ts) + "  " + event.kind + "  " + (event.detail || "");
    }).join("\n");
    return '<details><summary>报文 payload</summary><pre>' +
      esc(JSON.stringify(task.payload || {}, null, 2)) + "</pre></details>" +
      '<details><summary>原始事件 ' + (events || []).length + " 条</summary><pre>" +
      esc(lines) + "</pre></details>";
  }

  function runsHtml(runs) {
    if (!runs || !runs.length) return '<p class="hint">暂无运行记录</p>';
    return runs.slice().reverse().map(function (run) {
      var seconds = Math.max(0, Math.round((run.finished_at || run.started_at || 0) - (run.started_at || 0)));
      return '<div class="run"><div class="head">' +
        '<span class="' + (run.ok ? "ok" : "bad") + '">' + (run.ok ? "✓" : "✗") + "</span>" +
        "<b>" + esc(run.stage) + "</b><span>" + esc(run.agent) + "</span>" +
        '<span style="margin-left:auto">' + seconds + "s</span></div>" +
        (run.output ? '<details><summary>输出</summary><pre>' + esc(String(run.output).slice(0, 4000)) + "</pre></details>" : "") +
        "</div>";
    }).join("");
  }

  function approvalDetailHtml(detail) {
    var open = (detail.approvals || []).filter(function (ap) { return ap.status === "open"; });
    if (!open.length) return "";
    return open.map(function (ap) {
      var tokenValue = esc(ap.token);
      var recommend = num(ap.recommend);
      var buttons = (ap.options || []).map(function (label, index) {
        return '<button class="small' + (index === recommend ? " primary" : "") +
          '" data-decide="' + index + '" data-token="' + tokenValue + '">' + esc(label) + "</button>";
      }).join("");
      return '<div class="section"><h3>等你审批 · ' + esc(ap.stage) + "</h3>" +
        '<p class="hint">' + esc(ap.question) + "</p>" +
        '<div class="opts">' + buttons + "</div>" +
        '<textarea rows="2" style="margin-top:8px" placeholder="补充意见（提交视为通过）"></textarea>' +
        '<button class="send" data-send="1" data-token="' + tokenValue + '">提交这段话</button></div>';
    }).join("");
  }

  function messageBoxHtml(task) {
    if (task.status !== "running" || !task.session) return "";
    return '<div class="section"><h3>给运行中的会话发指令</h3>' +
      '<textarea id="drawer-message" rows="3" placeholder="补充要求、纠正方向、让它先停下来（忙时会作为下一轮消息）"></textarea>' +
      '<div class="dialog-actions" style="margin-top:8px">' +
      '<button id="drawer-send">发送指令</button></div></div>';
  }

  function drawerBodyHtml(detail) {
    var task = detail.task;
    return '<header><div><div class="badges">' +
      '<span class="tag ' + esc(task.status) + '">' + esc(task.status) + "</span>" +
      '<span class="stage">' + esc(task.stage) + "</span>" +
      '<span class="tag">' + esc(task.source) + "</span>" +
      "</div><h2>" + esc(task.title) + "</h2></div>" +
      '<button class="close small ghost" data-close="1">关闭</button></header>' +
      '<div class="body">' +
      '<div class="section"><h3>概览</h3>' + factsHtml(task) +
      (task.note ? '<p class="hint" style="margin-top:10px">' + esc(task.note) + "</p>" : "") + "</div>" +
      contextHtml(task) +
      deliveryHtml(detail) +
      approvalDetailHtml(detail) +
      messageBoxHtml(task) +
      approvalsHtml(detail) +
      '<div class="section"><h3>运行记录</h3>' + runsHtml(detail.runs) + "</div>" +
      processHtml(detail.events) +
      '<div class="section"><h3>原始数据</h3>' + rawHtml(task, detail.events) + "</div>" +
      "</div>" +
      '<div class="foot">' +
      (task.status === "failed" ? '<button class="small primary" data-retry="1">重试</button>' : "") +
      (task.status === "pending" ? '<button class="small" data-wake="1">唤醒</button>' : "") +
      (["pending", "running", "waiting"].indexOf(task.status) >= 0
        ? '<button class="small danger" data-cancel="1">取消任务</button>' : "") +
      "</div>";
  }

  async function refreshDetail(id) {
    // Don't clobber a draft the person is writing in the drawer.
    var drafts = drawer.querySelectorAll("textarea");
    for (var d = 0; d < drafts.length; d += 1) {
      if (drafts[d].value.trim()) return;
    }
    try {
      var response = await fetch("/api/tasks/" + id, { cache: "no-store" });
      var detail = await response.json();
      if (!detail.ok) throw new Error(detail.error || "任务不存在");
      var html = drawerBodyHtml(detail);
      if (html !== detailHtml) {
        var scroll = drawer.querySelector(".body");
        var top = scroll ? scroll.scrollTop : 0;
        drawer.innerHTML = html;
        detailHtml = html;
        var next = drawer.querySelector(".body");
        if (next) next.scrollTop = top;
      }
      if (drawer.hidden) { drawer.hidden = false; scrim.hidden = false; }
    } catch (err) {
      toast(err.message, true);
      closeDrawer();
    }
  }

  function openDrawer(id) {
    openTaskId = Number(id);
    detailHtml = "";
    drawer.hidden = false;
    scrim.hidden = false;
    document.body.classList.add("modal");
    drawer.innerHTML = '<div class="body"><p class="hint">加载中…</p></div>';
    refreshDetail(openTaskId);
  }

  function closeDrawer() {
    openTaskId = null;
    detailHtml = "";
    drawer.hidden = true;
    scrim.hidden = true;
    document.body.classList.remove("modal");
    drawer.innerHTML = "";
  }
  scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !drawer.hidden) closeDrawer();
  });

  /* --------------------------------------------------------- decisions */
  var inflight = {};

  async function decide(tokenValue, payload, trigger) {
    if (inflight[tokenValue]) return;
    inflight[tokenValue] = true;
    var box = trigger ? trigger.closest(".approval") : null;
    var buttons = trigger ? Array.prototype.slice.call(trigger.closest("div, .section").querySelectorAll("button")) : [];
    var label = trigger ? trigger.textContent : "";
    buttons.forEach(function (b) { b.disabled = true; });
    if (trigger) trigger.textContent = "提交中…";
    try {
      var response = await fetch("/a/" + encodeURIComponent(tokenValue), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      });
      var data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || ("HTTP " + response.status));
      toast(data.changed === false ? "这条已经处理过了" : (payload.index === 1 ? "已打回" : "已通过"));
      if (box) box.innerHTML = '<p class="q done">已提交，正在刷新…</p>';
    } catch (err) {
      toast("提交失败：" + err.message, true);
      buttons.forEach(function (b) { b.disabled = false; });
      if (trigger) trigger.textContent = label;
    } finally {
      delete inflight[tokenValue];
      lastJson = "";
      refresh();
      if (openTaskId) refreshDetail(openTaskId);
    }
  }

  /* -------------------------------------------------------------- events */
  board.addEventListener("click", function (event) {
    var button = event.target.closest("[data-decide]");
    if (button) {
      decide(button.dataset.token, { index: Number(button.dataset.decide) }, button);
      return;
    }
    var send = event.target.closest("[data-send]");
    if (send) {
      var area = send.closest(".approval, .section").querySelector("textarea");
      var text = area ? area.value.trim() : "";
      if (!text) { toast("先写一句再提交", true); return; }
      decide(send.dataset.token, { text: text }, send);
      return;
    }
    if (event.target.closest("textarea, input, select")) return;
    var card = event.target.closest(".card");
    if (card) openDrawer(card.dataset.id);
  });
  board.addEventListener("keydown", function (event) {
    if (event.key !== "Enter") return;
    if (event.target.closest("textarea, input, select, button")) return;
    var card = event.target.closest(".card");
    if (card) openDrawer(card.dataset.id);
  });

  drawer.addEventListener("click", async function (event) {
    if (event.target.closest("[data-close]")) { closeDrawer(); return; }

    var decideButton = event.target.closest("[data-decide]");
    if (decideButton) {
      decide(decideButton.dataset.token, { index: Number(decideButton.dataset.decide) }, decideButton);
      return;
    }
    var sendApproval = event.target.closest("[data-send]");
    if (sendApproval) {
      var area = sendApproval.closest(".section").querySelector("textarea");
      var text = area ? area.value.trim() : "";
      if (!text) { toast("先写一句再提交", true); return; }
      decide(sendApproval.dataset.token, { text: text }, sendApproval);
      return;
    }

    if (event.target.closest("#drawer-send")) {
      var box = document.getElementById("drawer-message");
      var message = box ? box.value.trim() : "";
      if (!message) { toast("先写一句指令", true); return; }
      var button = event.target.closest("#drawer-send");
      button.disabled = true;
      button.textContent = "发送中…";
      try {
        var result = await writeJSON("/api/tasks/" + openTaskId + "/message", { text: message });
        toast(result.ok ? "指令已送达会话" : "会话返回：失败", !result.ok);
        if (box) box.value = "";
      } catch (err) {
        toast("发送失败：" + err.message, true);
      } finally {
        button.disabled = false;
        button.textContent = "发送指令";
        refreshDetail(openTaskId);
      }
      return;
    }

    if (event.target.closest("[data-cancel]")) {
      if (!confirm("取消这个任务？正在进行的 agent 不会被强杀，但任务不再推进。")) return;
      try {
        await writeJSON("/api/tasks/" + openTaskId + "/cancel", {});
        toast("任务已取消");
        refreshDetail(openTaskId);
      } catch (err) { toast("取消失败：" + err.message, true); }
      return;
    }

    if (event.target.closest("[data-retry]")) {
      try {
        var again = await writeJSON("/api/tasks/" + openTaskId + "/retry", {});
        toast("已重新入队，任务 #" + again.task.id + " 会从当前阶段继续");
        refreshDetail(openTaskId);
      } catch (err) { toast("重试失败：" + err.message, true); }
      return;
    }

    if (event.target.closest("[data-wake]")) {
      try {
        await writeJSON("/api/tasks/" + openTaskId + "/wake", {});
        toast("已唤醒，等待 worker 处理");
        refreshDetail(openTaskId);
      } catch (err) { toast("唤醒失败：" + err.message, true); }
    }
  });

  /* ------------------------------------------------------------ composer */
  document.getElementById("new-task").addEventListener("click", function () {
    document.getElementById("composer-text").value = "";
    composer.showModal();
    document.getElementById("composer-text").focus();
  });
  document.getElementById("composer-cancel").addEventListener("click", function () {
    composer.close();
  });
  document.getElementById("composer-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var text = document.getElementById("composer-text").value.trim();
    if (!text) { toast("先写指令", true); return; }
    var project = document.getElementById("composer-project").value;
    var submit = document.getElementById("composer-submit");
    submit.disabled = true;
    submit.textContent = "创建中…";
    try {
      var payload = { title: text, kind: "instruction", source: "web" };
      if (project) payload.project = project;
      var data = await writeJSON("/api/tasks", payload);
      composer.close();
      toast("任务 #" + data.task_id + " 已创建");
      lastJson = "";
      refresh();
    } catch (err) {
      toast("创建失败：" + err.message, true);
    } finally {
      submit.disabled = false;
      submit.textContent = "创建任务";
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { lastJson = ""; refresh(); }
  });

  skeleton();
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
