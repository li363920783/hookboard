<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hookboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #101821;
    --card: #131d28;
    --line: #1f2c3a;
    --text: #e6edf3;
    --muted: #8aa0b3;
    --dim: #61758a;
    --pending: #94a3b8;
    --running: #60a5fa;
    --waiting: #fbbf24;
    --done: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  header.bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 22px;
    background: rgba(11, 15, 20, .86);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .02em; font-weight: 650; }
  .brand .mark { color: var(--waiting); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); align-self: center; }
  .dot.on { background: var(--done); box-shadow: 0 0 8px rgba(52, 211, 153, .55); }
  .dot.off { background: #ef4444; }
  #counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    background: var(--panel);
  }
  .chip b { font-weight: 650; color: var(--text); }
  .chip-pending b { color: var(--pending); }
  .chip-running b { color: var(--running); }
  .chip-waiting b { color: var(--waiting); }
  .chip-done b { color: var(--done); }

  main.board {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px; padding: 20px 22px 40px; align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .col > header {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 2px 8px;
  }
  .col h2 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .04em; color: var(--muted); }
  .col .n { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .col-pending .pulse { background: var(--pending); }
  .col-running .pulse { background: var(--running); }
  .col-waiting .pulse { background: var(--waiting); }
  .col-done .pulse { background: var(--done); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
    overflow-wrap: anywhere;
  }
  .col-running .card { border-left: 2px solid var(--running); }
  .col-waiting .card { border-left: 2px solid var(--waiting); }
  .col-done .card { opacity: .72; }
  .card .top { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  .src {
    color: #7dd3fc; background: #0b2a3a; border-radius: 6px; padding: 1px 7px;
    letter-spacing: .02em;
  }
  .ext { color: var(--dim); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .card h3 { margin: 8px 0 6px; font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); }
  .stage { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .card .note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }

  .approval { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .approval .q { margin: 0 0 8px; font-size: 12.5px; color: #fcd34d; white-space: pre-wrap; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12.5px; cursor: pointer;
    color: var(--text); background: #17232e; border: 1px solid #2b3d4f;
    border-radius: 8px; padding: 6px 11px;
  }
  button:hover { background: #1d2c39; }
  button.primary { background: #1d4ed8; border-color: #2563eb; }
  button.primary:hover { background: #2458e6; }
  .approval textarea {
    width: 100%; margin-top: 8px; padding: 7px 9px; resize: vertical;
    font: inherit; font-size: 12.5px; color: var(--text);
    background: #0d141b; border: 1px solid #2b3d4f; border-radius: 8px;
  }
  button.send { width: 100%; margin-top: 6px; }
  button:disabled { opacity: .55; cursor: progress; }
  .approval .q.done { color: var(--dim); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; color: var(--dim); font-size: 12px; padding: 12px; text-align: center; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #3b1219; color: #fecaca; border: 1px solid #7f1d1d;
    border-radius: 10px; padding: 9px 16px; font-size: 13px; max-width: 90vw;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 900px) {
    main.board { grid-template-columns: 1fr; gap: 22px; padding: 16px 14px 32px; }
    header.bar { padding: 12px 14px; flex-wrap: wrap; }
    .col h2 { font-size: 14px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark">◆</span>
    <h1>Hookboard</h1>
    <span id="live" class="dot" title="轮询 /api/board"></span>
  </div>
  <nav id="counts"></nav>
</header>

<main class="board" id="board"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var COLUMNS = [
    ["pending", "待处理"],
    ["running", "进行中"],
    ["waiting", "等你审批"],
    ["done", "已完成"]
  ];
  var board = document.getElementById("board");
  var counts = document.getElementById("counts");
  var liveDot = document.getElementById("live");
  var toastEl = document.getElementById("toast");
  var lastJson = "";
  var toastTimer = null;

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function num(value) {
    var n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }

  function elapsed(ts) {
    var n = Number(ts);
    if (!Number.isFinite(n)) return "—";
    var seconds = Math.max(0, Math.floor(Date.now() / 1000 - n));
    if (seconds < 60) return seconds + "s";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m";
    if (seconds < 86400) return Math.floor(seconds / 3600) + "h";
    return Math.floor(seconds / 86400) + "d";
  }

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 4000);
  }

  function approvalHtml(task) {
    var ap = task.approval;
    if (!ap) return "";
    var token = esc(ap.token);
    var options = Array.isArray(ap.options) ? ap.options : [];
    var recommend = Number.isFinite(Number(ap.recommend)) ? Number(ap.recommend) : 0;
    var buttons = options.map(function (label, index) {
      var cls = index === recommend ? "primary" : "";
      return '<button class="' + cls + '" data-decide="' + index + '" data-token="' +
        token + '">' + esc(label) + "</button>";
    }).join("");
    return '<div class="approval">' +
      '<p class="q">' + esc(ap.question) + "</p>" +
      '<div class="opts">' + buttons + "</div>" +
      '<textarea rows="2" placeholder="或者直接说（提交视为通过）"></textarea>' +
      '<button class="send" data-send="1" data-token="' + token + '">提交</button>' +
      "</div>";
  }

  function cardHtml(task) {
    var note = task.note ? '<p class="note">' + esc(task.note) + "</p>" : "";
    return '<article class="card">' +
      '<div class="top"><span class="src">' + esc(task.source) + "</span>" +
      '<span class="ext" title="' + esc(task.external_id) + '">' + esc(task.external_id) + "</span></div>" +
      "<h3>" + esc(task.title) + "</h3>" +
      '<div class="meta"><span class="stage">' + esc(task.stage) + "</span><span>·</span><span>" +
      elapsed(task.created_at) + "</span></div>" +
      note +
      approvalHtml(task) +
      "</article>";
  }

  function columnHtml(key, title, tasks) {
    var body = tasks.length
      ? tasks.map(cardHtml).join("")
      : '<div class="empty">暂无</div>';
    return '<section class="col col-' + key + '">' +
      '<header><span class="pulse"></span><h2>' + title + "</h2>" +
      '<span class="n">' + tasks.length + "</span></header>" + body + "</section>";
  }

  function render(data) {
    var byKey = {};
    (data.columns || []).forEach(function (column) { byKey[column.key] = column; });
    board.innerHTML = COLUMNS.map(function (pair) {
      var column = byKey[pair[0]] || { tasks: [] };
      return columnHtml(pair[0], pair[1], column.tasks || []);
    }).join("");

    var totals = data.counts || {};
    counts.innerHTML = COLUMNS.map(function (pair) {
      return '<span class="chip chip-' + pair[0] + '"><b>' + num(totals[pair[0]]) +
        "</b>" + pair[1] + "</span>";
    }).join("");
  }

  function isTyping() {
    var active = document.activeElement;
    if (!active || !board.contains(active)) return false;
    return active.tagName === "TEXTAREA" || active.tagName === "INPUT";
  }

  async function refresh() {
    if (isTyping()) return; // don't yank the textarea out from under the user
    try {
      var response = await fetch("/api/board", { cache: "no-store" });
      var data = await response.json();
      var encoded = JSON.stringify(data);
      if (encoded !== lastJson) {
        render(data);
        lastJson = encoded;
      }
      liveDot.className = "dot on";
    } catch (err) {
      liveDot.className = "dot off";
    }
  }

  var inflight = {}; // token -> true; blocks double submits

  async function decide(token, payload, trigger) {
    if (inflight[token]) return; // already submitting this approval
    inflight[token] = true;
    var box = trigger ? trigger.closest(".approval") : null;
    var buttons = box ? Array.prototype.slice.call(box.querySelectorAll("button")) : [];
    var label = trigger ? trigger.textContent : "";
    buttons.forEach(function (b) { b.disabled = true; });
    if (trigger) trigger.textContent = "提交中…";
    try {
      var response = await fetch("/a/" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      });
      var data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || ("HTTP " + response.status));
      if (data.changed === false) {
        toast("这条已经处理过了");
      } else {
        toast(payload.index === 1 ? "已打回" : "已通过");
      }
      if (box) box.innerHTML = '<p class="q done">已提交，正在刷新…</p>';
    } catch (err) {
      toast("提交失败：" + err.message);
      buttons.forEach(function (b) { b.disabled = false; });
      if (trigger) trigger.textContent = label;
    } finally {
      delete inflight[token];
      lastJson = "";
      refresh();
    }
  }

  board.addEventListener("click", function (event) {
    var button = event.target.closest("[data-decide]");
    if (button) {
      decide(button.dataset.token, { index: Number(button.dataset.decide) }, button);
      return;
    }
    var send = event.target.closest("[data-send]");
    if (send) {
      var box = send.closest(".approval").querySelector("textarea");
      var text = box ? box.value.trim() : "";
      if (!text) { toast("先写一句再提交"); return; }
      decide(send.dataset.token, { text: text }, send);
    }
  });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
