[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookboard"
version = "0.1.0"
description = "Hooks in, work out, with a human gate wherever you want one."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hookboard contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
hookboard = "hub.cli:main"

[tool.setuptools]
packages = ["hub", "hub.adapters"]